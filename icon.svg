<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="felt" cx="50%" cy="30%" r="80%">
      <stop offset="0" stop-color="#22675e"/>
      <stop offset="1" stop-color="#103833"/>
    </radialGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf9f3"/>
      <stop offset="1" stop-color="#ebe6da"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="16"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#felt)"/>
  <g transform="rotate(-9 256 256)" filter="url(#shadow)">
    <rect x="126" y="126" width="260" height="260" rx="58" fill="#d6d0c2"/>
    <rect x="126" y="118" width="260" height="256" rx="58" fill="url(#face)"/>
    <g fill="#1a1c21">
      <circle cx="191" cy="183" r="25"/>
      <circle cx="321" cy="183" r="25"/>
      <circle cx="256" cy="246" r="25"/>
      <circle cx="191" cy="309" r="25"/>
      <circle cx="321" cy="309" r="25"/>
    </g>
  </g>
</svg>
